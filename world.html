        log(1,'pirate',`Pirates flying the colours of ${b.name} began to prey on shipping ${near(b.x,b.y)}.`,[],b.x,b.y)}}
  }
  for(const b of S.bands.slice()){
    if(S.year-b.born>b.life){S.bands.splice(S.bands.indexOf(b),1);log(0,b.kind,`${capF(b.name)} scattered, rich and forgotten.`,[]);continue}
    for(let t=0;t<10;t++){const x=clamp(b.x+ri(-2,2),0,W-1),y=clamp(b.y+ri(-2,2),0,H-1),i=y*W+x;if(b.kind==='pirate'?(!isLand(G.biome[i])&&G.seaDist[i]<=5):isLand(G.biome[i])){b.x=x;b.y=y;break}}
    const t=S.sets.filter(s=>d2(s.x,s.y,b.x,b.y)<49&&(b.kind!=='pirate'||s.port));
    if(t.length&&chance(.3)){const s=pick(t),r=S.realms[s.realm];const take=Math.min(r.gold*.08,40+s.pop*.02);r.gold-=take;b.loot+=take;s.pop*=.99;b.size+=20;
      if(chance(.35))log(0,b.kind,`${capF(b.name)} ${b.kind==='pirate'?'raided the harbour of':'plundered the roads around'} ${sn(s)}, carrying off ${fmt(take)} crowns.`,['s'+s.id,'r'+r.id],s.x,s.y)}
    const owner=S.owner[b.y*W+b.x];const R=owner>=0?S.realms[owner]:null;

  }
}

/* ---------- monsters, heroes, great people ---------- */
function spawnBeast(){
  const roll=rand();let kind,cell=-1,name,ruin=null;
  const wild=c=>!tooClose(c%W,(c/W)|0,9);
  if(roll<.2&&S.ruins.length){kind='lich';ruin=pick(S.ruins);cell=ruin.y*W+ruin.x}
  else if(roll<.34){kind='serpent';for(let t=0;t<400;t++){const i=(rand()*N)|0;if(!isLand(G.biome[i])&&G.seaDist[i]>=2&&G.seaDist[i]<=6){cell=i;break}}}
  else{kind=roll<.76?'dragon':'giant';const want=kind==='dragon'?[B.MOUNTAIN,B.PEAK]:[B.HILLS,B.MOUNTAIN];
    for(let t=0;t<300;t++){const i=(rand()*N)|0;if(want.includes(G.biome[i])&&wild(i)){cell=i;break}}}
  if(cell<0)return;
  const x=cell%W,y=(cell/W)|0;
  if(kind==='dragon')name=cap1(pick(['Vor','Ska','Ith','Zar','Mal','Kry','Aur','Thra','Neth','Ghal','Oro','Syx'])+pick(['athax','iss','omir','yrex','ugor','andrax','esh','ion','abrax','emoth']))+' the '+pick(['Ashen','Red','Pale','Devourer','Undying','Gilded','Black','Stormborn','Old','Hungering']);
  else if(kind==='giant')name=given('orc',false)+' the '+pick(['Stone-Giant','Frost-Giant','Hill-King','Cyclops','Mountain-Shaker']);
  else if(kind==='serpent')name=cap1(pick(['Leviath','Thal','Mor','Ugl','Kra','Ny','Hy'])+pick(['assa','oth','ugor','ken','dris','yra']))+' the '+pick(['Deep-Coil','Ship-Breaker','Drowner','Sea-Wyrm','Abyssal']);
  else name=`Lich ${given('human',chance(.4))} of ${ruin.name}`;
  const b={id:S.nid++,kind,name,x,y,born:S.year,life:kind==='dragon'?ri(300,800):kind==='giant'?ri(60,180):kind==='serpent'?ri(100,400):ri(150,600),power:kind==='dragon'?ri(8,12):kind==='lich'?ri(6,10):kind==='serpent'?ri(6,9):ri(4,7),alive:true,kills:0,hoard:0};
  S.beasts.push(b);if(S.beasts.length>50)S.beasts.splice(0,S.beasts.findIndex(q=>!q.alive)+1||1);
  const msg=kind==='dragon'?`${bn(b)} awoke in the mountains ${near(x,y)}.`:kind==='giant'?`${bn(b)} came down from the high country ${near(x,y)}.`:kind==='serpent'?`Sailors spoke in terror of ${bn(b)}, risen from the deep ${near(x,y)}.`:`In the ruins of ${ruin.name}, ${bn(b)} rose from the grave.`;
  log(2,kind,msg,['b'+b.id],x,y);
}
function beastStep(){
  const alive=S.beasts.filter(b=>b.alive);
  const wild=X.free.length/G.land;
  if(alive.length<3&&S.year>30&&chance(.012*Q*(.4+wild*2)))spawnBeast();
  for(const b of alive){
    if(S.year-b.born>b.life){b.alive=false;log(1,b.kind,b.kind==='lich'?`The unlife of ${bn(b)} guttered out at last.`:`${bn(b)} was never seen again. Some say it sleeps still.`,['b'+b.id]);continue}
    if(chance(.2*Q)){
      let t=S.sets.filter(s=>d2(s.x,s.y,b.x,b.y)<256);if(b.kind==='serpent')t=t.filter(s=>s.port);if(!t.length)continue;
      const s=wpick(t,s=>Math.sqrt(s.pop)/(1+Math.sqrt(d2(s.x,s.y,b.x,b.y))));
      const loss=s.pop*(.05+rand()*.2)/(s.b.walls?1.6:1);b.kills+=loss;const r=S.realms[s.realm];if(b.kind==='dragon'){const g=r.gold*.1;r.gold-=g;b.hoard+=g}
      if(s.pop<450||chance(.04)){destroySettlement(s,b.kind==='dragon'?`was burned to ash by ${bn(b)}`:b.kind==='lich'?`was emptied by the dead servants of ${bn(b)}`:b.kind==='serpent'?`was dragged beneath the waves by ${bn(b)}`:`was crushed to rubble by ${bn(b)}`,['b'+b.id],b.kind);}
      else{s.pop-=loss;log(1,b.kind,`${bn(b)} fell upon ${sn(s)}. ${fmtDead(loss)} perished.`,['b'+b.id,'s'+s.id,'r'+s.realm],s.x,s.y)}
    }
    if(b.kind!=='lich'&&chance(.04*Q)){for(let t=0;t<60;t++){const x=clamp(b.x+ri(-15,15),0,W-1),y=clamp(b.y+ri(-15,15),0,H-1),i=y*W+x,bb=G.biome[i];
      if(b.kind==='serpent'?(!isLand(bb)&&G.seaDist[i]>=1&&G.seaDist[i]<=7):(bb===B.MOUNTAIN||bb===B.PEAK||bb===B.HILLS)){b.x=x;b.y=y;break}}}
  }
}
const EPITHET={dragon:'Dragonsbane',lich:'the Lightbringer',giant:'Giantfeller',serpent:'the Wave-Rider'};
function heroStep(){
  const beasts=S.beasts.filter(b=>b.alive),heroes=S.heroes.filter(h=>h.alive);
  if(heroes.length<6&&S.sets.length&&chance((.012+beasts.length*.025)*Q)){
    const s=beasts.length?wpick(S.sets,s=>1/(1+Math.min(...beasts.map(b=>d2(s.x,s.y,b.x,b.y))))):pick(S.sets);
    const r=S.realms[s.realm],f=chance(.4);
    const h={id:S.nid++,name:given(r.race,f),f,race:r.race,realm:r.id,home:s.name,hx:s.x,hy:s.y,born:S.year-ri(16,24),alive:true,ep:null,deeds:0};
    S.heroes.push(h);if(S.heroes.length>60)S.heroes.splice(0,S.heroes.findIndex(q=>!q.alive)+1||1);
    log(1,'hero',`${hn(h)} of ${sn(s)} took up ${RACES[r.race].weapon}${beasts.length?', swearing to rid the land of monsters':''}.`,['s'+s.id,'r'+r.id],s.x,s.y);
  }
  for(const h of S.heroes){if(!h.alive)continue;
    const age=(S.year-h.born)/RACES[h.race].life;
    if(age>55+rand()*25&&chance(.15*Q)){h.alive=false;if(h.ep||h.deeds>2)log(1,'death',`${hn(h)} died, and was mourned across ${S.realms[h.realm].alive?rn(S.realms[h.realm]):'the land'}.`,['r'+h.realm]);continue}
    const live=S.beasts.filter(b=>b.alive);if(!live.length||!chance(.2*Q))continue;
    const b=live.reduce((a,c)=>d2(c.x,c.y,h.hx,h.hy)<d2(a.x,a.y,h.hx,h.hy)?c:a);if(d2(b.x,b.y,h.hx,h.hy)>1225)continue;
    if(chance(clamp(.3+h.deeds*.06-b.power*.012,.08,.7))){
      b.alive=false;b.slain=S.year;h.ep=h.ep||EPITHET[b.kind];h.deeds+=3;
      const R=S.realms[h.realm];if(R.alive){R.stab=Math.min(100,R.stab+12);R.gold+=b.kills/20+b.hoard}
      log(2,'slay',`${hn(h)} slew ${bn(b)}, ending ${S.year-b.born} years of terror${b.hoard>100?` and carrying home a hoard of ${fmt(b.hoard)} crowns`:''}.`,['b'+b.id,'r'+h.realm],b.x,b.y);
    }else{h.alive=false;log(1,'death',`${hn(h)} rode out to face ${bn(b)} and was never seen again.`,['b'+b.id,'r'+h.realm],b.x,b.y)}
  }
}
function greatStep(){
  const alive=S.greats.filter(p=>p.alive);
  if(alive.length<12){for(const r of S.realms){if(!r.alive)continue;const ss=setsOf(r.id);if(ss.length<2)continue;
    if(!chance(.0035*(1+techOf(r)*.25)*Math.min(3,ss.length/4)*(r.golden>S.year?2:1)*(ss.some(s=>s.b.university)?1.6:1)))continue;

    const s=wpick(ss,s=>s.pop),f=chance(.45);
    const p={id:S.nid++,kind:k,name:given(r.race,f),f,realm:r.id,home:s.name,born:S.year-ri(18,30),alive:true,works:[],deeds:0,race:r.race};
    S.greats.push(p);if(S.greats.length>100)S.greats.splice(0,S.greats.findIndex(q=>!q.alive)+1||1);
    const intro={scholar:`The scholar ${gn(p)} began teaching in ${sn(s)}.`,artist:`In ${sn(s)}, the young artist ${gn(p)} drew crowds and patrons alike.`,
      general:`${gn(p)} of ${sn(s)} rose through the ranks to command the armies of ${rn(r)}.`,explorer:`The explorer ${gn(p)} set sail from ${sn(s)} to chart the unknown seas.`,
      mage:`${gn(p)} of ${sn(s)} was named Archmage of ${rn(r)}.`}[k];

    if(GREAT[p.kind].w.length&&p.works.length<3&&chance(.06)){const n=pick(GREAT[p.kind].w).replace('{a}',pick(WORK_A));p.works.push({n,y:S.year});
      log(p.works.length===1?1:0,GREAT[p.kind].ico,`${gn(p)} completed ${n}.`,['g'+p.id,'r'+p.realm])}
    if(p.kind==='explorer'&&chance(.08)){X.explore=p.realm;p.deeds++;if(chance(.5))log(1,'explorer',`${gn(p)} returned with charts of distant shores, and ships of ${rn(r)} followed.`,['g'+p.id,'r'+p.realm])}

        let dead=0;for(const t of S.sets.slice())if(d2(t.x,t.y,cx,cy)<=rad*rad){if(t.pop<800){dead+=t.pop;destroySettlement(t,`was unmade by wild magic`,['g'+p.id],'blight')}else{dead+=t.pop*.4;t.pop*=.6}}
        p.alive=false;p.died=S.year;
        log(2,'blight',`An experiment of the Archmage ${gn(p)} went terribly wrong. A blight of wild magic scarred the land ${near(cx,cy)}${dead>0?` and ${fmtDead(dead)} perished`:''}.`,['g'+p.id,'r'+p.realm],cx,cy);}
      else if(r.k.arcane<6){const lv=r.k.arcane;r.k.arcane++;log(1,'mage',`The Archmage ${gn(p)} unlocked the secrets of ${FIELDS.arcane.l[lv]} for ${rn(r)}.`,['g'+p.id,'r'+p.realm])}
    }
  }
}

/* ---------- the turning of the seasons ---------- */
function events(){
  const alive=S.realms.filter(r=>r.alive);
  if(S.season===3)warsWinter();
  if(S.season===1)for(const s of S.sets){if(s.pop>12000&&s.w.length<2){const r=S.realms[s.realm];if(r.tier>=1&&r.gold>700&&r.income>25&&chance(.005*(1+techOf(r)*.25)*(hasT(r,'Builder')?3:1)*(r.golden>S.year?2:1))){
    r.gold-=700;const n=`the ${pick(WON_A)} ${pick(WON_B)}`;s.w.push({n,y:S.year});log(2,'wonder',`Builders of ${rn(r)} completed ${n} in ${sn(s)}.`,['r'+r.id,'s'+s.id],s.x,s.y)}}}
  const living=new Set(alive.map(r=>r.faith));
  if(S.sets.length&&chance((.005+(living.size<3?.012:0))*Q)){

      const x0=f.t0x,y0=f.t0y,x1=f.x,y1=f.y,mx=(x0+x1)/2-(y1-y0)*.2,my=(y0+y1)/2+(x1-x0)*.2,e=a<.5?2*a*a:1-Math.pow(-2*a+2,2)/2;

      ctx.globalAlpha=Math.min(1,(1-a)*4);drawToken(ctx,'sailboat',sx(px),sy(py)+Math.sin(T*6),24,'#ece2cf',{bg:1,ring:pal('economy')});ctx.globalAlpha=1;continue}

  if(cw>700){drawCompass(cw-(sideOpen?470:72),ch-(sideOpen?200:186),17);drawScale(cw-(sideOpen?636:236),ch-(sideOpen?176:166));drawNeatline()}
}

/* =====================================================================
   AUDIO · a generative soundtrack, started only by the viewer
   ===================================================================== */
const Sound={ctx:null,master:null,verb:null,on:false,timer:0,
  start(){
    if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;this.ctx=new C();
      const c=this.ctx;this.master=c.createGain();this.master.gain.value=0;this.master.connect(c.destination);
      // a simple feedback delay stands in for a hall
      const d=c.createDelay(1.5);d.delayTime.value=.43;const fb=c.createGain();fb.gain.value=.42;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
      d.connect(lp);lp.connect(fb);fb.connect(d);this.verb=c.createGain();this.verb.gain.value=.5;this.verb.connect(d);d.connect(this.master);
      // drone
      const dg=c.createGain();dg.gain.value=.05;const df=c.createBiquadFilter();df.type='lowpass';df.frequency.value=380;dg.connect(df);df.connect(this.master);
      for(const[f,det]of[[55,0],[82.4,4],[110,-5]]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=det;o.connect(dg);o.start()}
      const lfo=c.createOscillator();lfo.frequency.value=.05;const lg=c.createGain();lg.gain.value=160;lfo.connect(lg);lg.connect(df.frequency);lfo.start();
    }
    this.ctx.resume();this.on=true;this.master.gain.setTargetAtTime(.55,this.ctx.currentTime,1.2);this.timer=this.ctx.currentTime+.5;return true;
  },
  stop(){if(!this.ctx)return;this.on=false;this.master.gain.setTargetAtTime(0,this.ctx.currentTime,.4)},
  tone(f,dur,type,vol,when){const c=this.ctx,t=when||c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.master);g.connect(this.verb);o.start(t);o.stop(t+dur+.05)},
  tick(){
    if(!this.on||!this.ctx)return;const c=this.ctx;
    if(c.currentTime>this.timer){const scale=[220,246.9,277.2,329.6,370,440,493.9,554.4,659.3];const f=scale[(Math.random()*scale.length)|0];
      this.tone(f,2.6,'triangle',.07);if(Math.random()<.35)this.tone(f*1.5,2.2,'sine',.035,c.currentTime+.18);
      this.timer=c.currentTime+1.4+Math.random()*3.2}
  },
  cue(cat){
    if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime;
    if(cat==='war'||cat==='battle'||cat==='siege'){for(let k=0;k<3;k++){this.tone(62,.5,'sine',.32,t+k*.22);this.noise(.12,.12,t+k*.22)}}
    else if(cat==='crown'||cat==='rise'||cat==='golden'||cat==='wonder'||cat==='slay'){for(const[f,v]of[[523.3,.12],[784,.07],[1046.5,.05],[1318.5,.03]])this.tone(f,3.2,'sine',v,t)}
    else if(cat==='fall'||cat==='death'||cat==='plague'||cat==='blight'){this.tone(98,2.6,'triangle',.16,t);this.tone(116.5,2.6,'triangle',.1,t+.08)}
    else if(cat==='dragon'||cat==='serpent'||cat==='giant'||cat==='lich'){this.tone(46,2.2,'sawtooth',.12,t);this.noise(.8,.08,t)}
    else if(cat==='era'){for(const[f,d]of[[392,0],[523.3,.25],[659.3,.5],[784,.75]])this.tone(f,2.8,'triangle',.08,t+d)}
  },
  noise(dur,vol,t){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=vol;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=900;s.connect(f);f.connect(g);g.connect(this.master);s.start(t)},
};

/* =====================================================================

(function buildSprite(){
  let s='<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">';
  for(const k in TI)s+=`<symbol id="i-${k}" viewBox="0 0 512 512">${TI[k].map(([d])=>`<path d="${d}"/>`).join('')}</symbol>`;
  $('#sprite').innerHTML=s+'</svg>';
})();
const ico=(k,cls='i')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${TI[k]?k:'circle-dot'}"/></svg>`;
const icd=(k,d)=>`<span class="ic" style="--d:${pal(d)}">${ico(k)}</span>`;
const chip=c=>icd(catIcon(c),catDom(c));
const sigil=d=>`<svg class="sigil" viewBox="0 0 24 24" aria-hidden="true"><path d="${DOMAIN[d].sig}"/></svg>`;

let playing=true,speed=1,acc=0,last=performance.now(),uiDirty=true,lastUi=0,logLevel=1,tab='chronicle',realmSort='pop',sideOpen=true,fallenOpen=false,legendCollapsed=window.innerWidth<1000;

const logEl=$('#log');

/* ---------- chronicle ---------- */
function domainChips(){$('#domainChips').innerHTML=DOMAIN_KEYS.map(k=>`<button type="button" class="sg" data-d="${k}" aria-pressed="${!domOff.has(k)}" aria-label="${DOMAIN[k].n}" data-tip="${DOMAIN[k].n}" style="--d:${pal(k)}"><svg viewBox="0 0 24 24"><path d="${DOMAIN[k].sig}"/></svg></button>`).join('')}
const visible=e=>e.i>=logLevel&&(e.i===3||!domOff.has(catDom(e.c)));
function evEl(e,isFresh){
  if(e.i===3){const d=document.createElement('div');d.className='era-row';d.innerHTML=`<div>${e.t.replace(/^The /,'')}</div><small>Anno ${e.y} · a new age</small>`;return d}
  const d=document.createElement('div');const dom=catDom(e.c);d.className=`ev i${e.i}${isFresh?' fresh':''}`;d.style.setProperty('--d',pal(dom));
  d.innerHTML=`${chip(e.c)}<div><div class="t">${e.t}</div><div class="meta"><span class="dom">${DOMAIN[dom].n}</span><span>·</span><span>${SEASONS[e.s??0]}</span></div></div>`;return d}
function yearHead(y){const h=document.createElement('div');h.className='yearhead';h.dataset.y=y;h.innerHTML=`<span class="y">Anno<b>${y}</b></span><span class="rn">${roman(Math.max(1,y))}</span>`;return h}
function rebuildLog(){
  logEl.textContent='';const items=S.log.filter(visible).slice(-320).reverse();const f=document.createDocumentFragment();let y=null;
  for(const e of items){if(e.i!==3&&e.y!==y){y=e.y;f.appendChild(yearHead(y))}f.appendChild(evEl(e,false))}
  if(!items.length){const d=document.createElement('div');d.className='empty';d.textContent='Nothing yet matches these filters. History is still being written.';f.appendChild(d)}
  logEl.appendChild(f);
}
function flushLog(){
  if(!fresh.length)return;
  const items=fresh.filter(visible);
  if(items.length>40)rebuildLog();
  else for(const e of items){
    const first=logEl.firstElementChild;if(first&&first.classList.contains('empty'))first.remove();
    const top=logEl.firstElementChild;
    if(e.i===3)logEl.prepend(evEl(e,true));
    else if(top&&top.classList.contains('yearhead')&&+top.dataset.y===e.y)top.after(evEl(e,true));
    else{logEl.prepend(evEl(e,true));logEl.prepend(yearHead(e.y))}
  }
  while(logEl.children.length>380)logEl.lastChild.remove();
  const great=fresh.filter(e=>e.i>=2);
  if(great.length&&playing){for(const e of great.slice(-2))toast(e);const g=great[great.length-1];Sound.cue(g.c);
    if(opts.follow){const e=[...great].reverse().find(e=>e.x!=null);if(e)flyTo(e.x,e.yy,Math.max(2.2,Math.min(view.z,3.4)))}}
  else if(fresh.length){const c=fresh.find(e=>e.i>=1&&(e.c==='war'||e.c==='battle'));if(c)Sound.cue(c.c)}
  fresh=[];
}
function toast(e){
  if(e.i===3)return;
  const el=document.createElement('div');el.className='herald';el.style.setProperty('--d',pal(catDom(e.c)));
  el.innerHTML=`${chip(e.c)}<div><span class="yy">${DOMAIN[catDom(e.c)].n} · ${SEASONS[e.s??0]}, anno ${e.y}</span>${e.t}</div>`;
  el.addEventListener('click',ev=>{if(ev.target.closest('[data-ref]'))return;if(e.x!=null)flyTo(e.x,e.yy,3);if(e.r[0])selectRef(e.r[0])});
  const box=$('#toasts');box.prepend(el);while(box.children.length>2)box.lastChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),500)},7000);
}

// the moon waxes through the year: a sliver in spring, full by summer's end, waning in autumn, dark in winter
function moonPath(f){const r=15,cx=30,cy=30,k=Math.cos(f*Math.PI*2),rx=Math.abs(k)*r;
  if(f<.5)return`M${cx} ${cy-r}A${r} ${r} 0 0 1 ${cx} ${cy+r}A${rx} ${r} 0 0 ${k>0?0:1} ${cx} ${cy-r}Z`;
  return`M${cx} ${cy-r}A${r} ${r} 0 0 0 ${cx} ${cy+r}A${rx} ${r} 0 0 ${k>0?1:0} ${cx} ${cy-r}Z`}
function setRete(frac){
  if(!S)return;const t=(S.season+frac)/4,a=t*Math.PI*2-Math.PI/2;
  const d=$('#moonDot');d.setAttribute('cx',(30+Math.cos(a)*27).toFixed(2));d.setAttribute('cy',(30+Math.sin(a)*27).toFixed(2));
  $('#moonPhase').setAttribute('d',moonPath((t*.5+.12)%1));
}

  $('#kpis').innerHTML=K('people',`<b>${fmt(pop)}</b> souls`)+K('politics',`<b>${indep}</b> realms${alive.length>indep?`, ${alive.length-indep} vassals`:''}`)+K('nature',`<b>${S.sets.length}</b> settlements`)+
    K('war',`<b>${wars}</b> war${wars===1?'':'s'}${soldiers?`, ${fmt(soldiers)} under arms`:''}`)+K('economy',`<b>${(X.routes||[]).length}</b> trade roads`)+

/* ---------- shared pieces ---------- */
function shareBar(parts){const tot=parts.reduce((a,p)=>a+p.v,0)||1;
  return`<div class="mixbar">${parts.map(p=>`<i style="width:${p.v/tot*100}%;background:${p.c}"></i>`).join('')}</div><div class="mixkeys">${parts.filter(p=>p.v/tot>.01).map(p=>`<span><b style="background:${p.c}"></b>${p.n} ${(p.v/tot*100).toFixed(0)}%</span>`).join('')}</div>`}
function mixBar(mix){return shareBar(Object.entries(mix).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({n:RACES[k].pl.replace(/^./,c=>c.toUpperCase()),v,c:`rgb(${RACE_RGB[k].join(',')})`})))}
const bar=(k,v,f,d)=>`<div class="bar"><span class="k">${k}</span><span class="t"><i style="width:${clamp(f,0,1)*100}%${d?`;--d:${d}`:''}"></i></span><span class="v">${v}</span></div>`;
const fact=(k,v)=>`<div class="fact"><div class="k">${k}</div><div class="v">${v}</div></div>`;
function historyFor(pred){const items=S.log.filter(pred).slice(-40).reverse();return items.length?`<div class="log">${items.map(e=>evEl(e,false).outerHTML).join('')}</div>`:'<div class="empty">Nothing recorded yet.</div>'}
const byRef=ref=>e=>e.r.includes(ref);
function spark(id){
  const pts=S.hist.filter(h=>h.p[id]!=null);if(pts.length<2)return'<div class="empty">Too young to chart.</div>';
  const y0=pts[0].y,y1=pts[pts.length-1].y,mx=Math.max(...pts.map(h=>h.p[id]));
  const P=pts.map(h=>`${((h.y-y0)/Math.max(1,y1-y0)*300).toFixed(1)},${(52-h.p[id]/mx*46).toFixed(1)}`).join(' ');
  return`<svg class="spark" viewBox="0 0 300 54" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#cfa960" stop-opacity=".28"/><stop offset="1" stop-color="#cfa960" stop-opacity="0"/></linearGradient></defs><polygon points="0,54 ${P} 300,54" fill="url(#sg${id})"/><polyline points="${P}" fill="none" stroke="#e9cd8f" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg><div class="spark-l"><span>${y0}</span><span>PEAK ${fmt(mx)}</span><span>${y1}</span></div>`;
}
function relBar(v){const w=Math.abs(v)/2;return`<span class="rel"><i style="${v<0?`right:50%;width:${w}%;background:#c8574a`:`left:50%;width:${w}%;background:#79a891`}"></i></span>`}

function sizeChart(){const r=chartCv.getBoundingClientRect();chartW=r.width;chartH=r.height;chartCv.width=Math.max(1,Math.round(chartW*dpr));chartCv.height=Math.max(1,Math.round(chartH*dpr));chartDirty=true}
const CH_PAD={l:8,r:8,t:8,b:6};
function drawChart(){
  chartDirty=false;const c=cctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,chartW,chartH);
  const hs=S.hist;if(hs.length<2||chartH<16)return;
  const y0=hs[0].y,y1=hs[hs.length-1].y,pw=chartW-CH_PAD.l-CH_PAD.r,ph=chartH-CH_PAD.t-CH_PAD.b;
  let mx=1;for(const h of hs){let t=0;for(const k in h.p)t+=h.p[k];if(t>mx)mx=t}
  const X_=y=>CH_PAD.l+(y-y0)/Math.max(1,y1-y0)*pw,Y_=v=>CH_PAD.t+ph-v/mx*ph;
  const ids=new Set();for(const h of hs)for(const k in h.p)ids.add(+k);const order=[...ids].sort((a,b)=>a-b);
  const cum=new Float64Array(hs.length);
  for(const id of order){const r=S.realms[id];if(!r)continue;c.beginPath();
    for(let i=0;i<hs.length;i++){const v=cum[i]+(hs[i].p[id]||0);const x=X_(hs[i].y),y=Y_(v);i?c.lineTo(x,y):c.moveTo(x,y)}
    for(let i=hs.length-1;i>=0;i--)c.lineTo(X_(hs[i].y),Y_(cum[i]));
    c.closePath();c.fillStyle=r.color;c.globalAlpha=.78;c.fill();c.globalAlpha=1;
    for(let i=0;i<hs.length;i++)cum[i]+=hs[i].p[id]||0;
  }
  c.strokeStyle='#e9cd8f';c.lineWidth=1.2;c.beginPath();for(let i=0;i<hs.length;i++){const x=X_(hs[i].y),y=Y_(cum[i]);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
  for(const e of S.eras){if(e.start<=y0||e.start>y1)continue;const x=X_(e.start);c.strokeStyle='rgba(233,205,143,.3)';c.beginPath();c.moveTo(x+.5,CH_PAD.t);c.lineTo(x+.5,CH_PAD.t+ph);c.stroke();
    const s=3.5,cy=CH_PAD.t;c.fillStyle='#e9cd8f';c.beginPath();c.moveTo(x,cy-s);c.quadraticCurveTo(x+.6,cy-.6,x+s,cy);c.quadraticCurveTo(x+.6,cy+.6,x,cy+s);c.quadraticCurveTo(x-.6,cy+.6,x-s,cy);c.quadraticCurveTo(x-.6,cy-.6,x,cy-s);c.fill()}
}

const ptrs=new Map();let drag=null,pinch=null;
function cellAt(mx,my){const s=base*view.z,x=Math.floor((mx-view.ox)/s),y=Math.floor((my-view.oy)/s);if(x<0||y<0||x>=W||y>=H)return null;return{x,y,cell:y*W+x,fx:(mx-view.ox)/s-.5,fy:(my-view.oy)/s-.5}}
function thingAt(c){
  if(!c)return null;
  const s=base*view.z,tol=Math.max(1.1,11/s),t2=tol*tol;
  let best=null,bd=t2;const consider=(t,id,x,y,o)=>{const d=d2(x,y,c.fx,c.fy);if(d<bd){bd=d;best={t,id,o}}};
  for(const a of S.armies)consider('a',a.id,a._x??a.x,a._y??a.y,a);
  for(const b of S.beasts)if(b.alive)consider('b',b.id,b.x,b.y,b);
  if(best)return best;
  for(const t of S.sets)consider('s',t.id,t.x,t.y,t);if(best)return best;
  bd=Math.min(t2,1);for(const r of S.ruins)consider('ruin',r.id,r.x,r.y,r);if(best)return best;
  const o=S.owner[c.cell];if(o>=0)return{t:'r',id:o,o:S.realms[o]};
  return null;
}
function showTip(mx,my){
  const tip=$('#tip'),c=cellAt(mx,my);hover=c;if(!c||!S){tip.hidden=true;return}
  const th=thingAt(c),b=G.biome[c.cell],o=S.owner[c.cell];let h='';
  const hc=(k,d)=>`<span class="hc-ico" style="--d:${pal(d)}">${ico(k)}</span>`;
  if(th&&th.t==='s'){const t=th.o,r=S.realms[t.realm];const sick=S.plagues.some(p=>p.act[t.id]!=null);
    h=`<span class="hc-ico">${bannerSVG(r,20)}</span><b>${t.name}</b><span class="k">${kind(t.pop).toLowerCase()} of ${fmt(t.pop)} souls, ${r.name}</span><span>${r.cap===t.id?tag('seat','gold'):''}${t.b.walls?tag('walled','blue'):''}${t.w.length?tag('wonder','line gold'):''}${sick?tag('plague','violet'):''}${t.food<.05?tag('hungry','war'):''}</span>`}
  else if(th&&th.t==='a'){const a=th.o,r=S.realms[a.realm],t=X.byId.get(a.target);h=`<span class="hc-ico">${bannerSVG(r,20)}</span><b>${capF(a.name)}</b><span class="k">${fmt(a.size)} soldiers of ${r.name}</span><span class="k">${a.state==='siege'?`besieging ${t?t.name:''}, ${Math.round(a.siege*100)}%`:a.state==='retreat'?'in retreat':t?`marching on ${t.name}`:'holding'}</span>`}
  else if(th&&th.t==='b')h=`${hc(catIcon(th.o.kind),'monster')}<b>${th.o.name}</b><span class="k">${th.o.kind}, first seen in ${th.o.born}</span>`;
  else if(th&&th.t==='ruin')h=`${hc('building-arch','death')}<b>Ruins of ${th.o.name}</b><span class="k">destroyed in ${th.o.year}</span>`;
  else if(o>=0){const r=S.realms[o];h=`<span class="hc-ico">${bannerSVG(r,20)}</span><b>${r.name}</b><span class="k">${BIOME[b].n}${G.river[c.cell]?', river':''}${G.res[c.cell]?', '+RES[G.res[c.cell]].n.toLowerCase():''}${S.farm[c.cell]?', fields':''}</span><span>${r.overlord!=null?tag('vassal','violet'):''}${X.atWar.has(r.id)?tag('at war','war'):''}${X.scar[c.cell]<1?tag('blighted','violet'):''}</span>`}
  else h=`${hc(isLand(b)?'mountain':'ship',isLand(b)?'nature':'knowledge')}<b>${BIOME[b].n}</b><span class="k">${isLand(b)?'unclaimed wilds':'open water'}${G.res[c.cell]?', '+RES[G.res[c.cell]].n.toLowerCase():''}</span>`;
  tip.innerHTML=h;tip.hidden=false;
  const tw=tip.offsetWidth,tht=tip.offsetHeight;tip.style.left=clamp(mx+16,4,cw-tw-4)+'px';tip.style.top=clamp(my+16,4,ch-tht-4)+'px';
}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});cam=null;
  if(ptrs.size===1)drag={x:e.offsetX,y:e.offsetY,ox:view.ox,oy:view.oy,moved:false};
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:view.z};drag=null}});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch.z*d/pinch.d/view.z,(a.x+b.x)/2,(a.y+b.y)/2);return}
  if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;cv.classList.add('dragging')}
    if(drag.moved){view.ox=drag.ox+dx;view.oy=drag.oy+dy;clampView();$('#tip').hidden=true;return}}
  if(e.pointerType==='mouse')showTip(e.offsetX,e.offsetY);
});
function endPtr(e){
  const wasDrag=drag;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(wasDrag&&!wasDrag.moved&&e.type==='pointerup'&&S){const th=thingAt(cellAt(e.offsetX,e.offsetY));if(th){navStack.length=0;select({t:th.t,id:th.id},false)}else if(sel){navStack.length=0;closeDetail()}if(e.pointerType!=='mouse')showTip(e.offsetX,e.offsetY)}
  drag=null;cv.classList.remove('dragging');
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){$('#tip').hidden=true;hover=null}});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.18:1/1.18,e.offsetX,e.offsetY)},{passive:false});

function makeClouds(seed){
  // shadow and cloud baked into one wrapping sheet: drawn four times a frame
  const light=genClouds(seed),w=light.width,h=light.height;
  const dark=document.createElement('canvas');dark.width=w;dark.height=h;const d=dark.getContext('2d');d.drawImage(light,0,0);d.globalCompositeOperation='source-in';d.fillStyle='#0a0f1c';d.fillRect(0,0,w,h);
  const out=document.createElement('canvas');out.width=w;out.height=h;const c=out.getContext('2d');const ox=Math.round(1.6*w/W),oy=Math.round(1.2*h/H);
  c.globalAlpha=.55;for(const ax of[ox-w,ox])for(const ay of[oy-h,oy])c.drawImage(dark,ax,ay);
  c.globalAlpha=1;c.drawImage(light,0,0);
  return out;
}
function afterTicks(newYear){renderHeader();flushLog();uiDirty=true;if(newYear){chartDirty=true;if(S.year%10===0)save()}}
let lastPol=0,lastMini=0;
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(S&&playing){acc+=dt*speed;let n=0,y0=S.year;while(acc>=1&&n<16){stepSeason();acc-=1;n++}if(n)afterTicks(S.year!==y0)}
  if(S){
    setRete(clamp(acc,0,.999));
    if(dirtyPol&&now-lastPol>(speed>=4&&playing?200:0)){lastPol=now;rebuildPol()}
    if(chartDirty)drawChart();
    if(uiDirty&&now-lastUi>600){lastUi=now;uiDirty=false;renderCurrent();if(mode!=='terrain')renderLegend()}
    if(miniDirty&&now-lastMini>250){lastMini=now;drawMini()}
  }
  stepCamera(dt);draw(now,dt);Sound.tick();
  requestAnimationFrame(frame);
}
function showBanner(years,events){
  const el=$('#banner');
  el.innerHTML=`<h3>${years} years passed while you were away</h3><p>${S.name} kept turning without you. These were its greatest moments:</p><div class="log">${events.slice(-7).reverse().map(e=>evEl(e,false).outerHTML).join('')||'<div class="empty">The years were quiet.</div>'}</div><button class="btn-line gold" type="button" id="bannerOk">Continue watching</button>`;
  el.hidden=false;$('#scrim').hidden=false;$('#bannerOk').onclick=()=>{el.hidden=true;$('#scrim').hidden=true};
}
function afterLoad(){
  sel=null;navStack.length=0;fx.length=0;fresh=[];dirtyPol=true;dirtyNet=true;farmDirty=true;chartDirty=true;view.z=1;cam=null;clampView();
  clouds=makeClouds(S.seed);
  renderHeader();rebuildLog();setTab(tab);renderLegend();
  $('#loading').hidden=true;
}
function genesis(seed){
  $('#loadingSub').textContent='raising mountains';$('#loading').hidden=false;$('#banner').hidden=true;
  setTimeout(()=>{newWorld(seed);afterLoad();save()},60);
}
function start(data){
  resize();
  setTimeout(()=>{
    let ok=false;
    if(data&&data.save){try{ok=restore(data.save)}catch(e){ok=false}}
    if(!ok)ok=loadSaved();
    if(ok){
      const away=(Date.now()-(S.saved||Date.now()))/60000;const seasons=Math.min(1000,Math.floor(away*8));
      if(seasons>=12&&!(data&&data.save)){$('#loadingSub').textContent='catching up on the lost years';
        setTimeout(()=>{const y0=S.year;X.silent=true;for(let i=0;i<seasons;i++)stepSeason();X.silent=false;fresh=[];
          const ev=S.legends.filter(e=>e.y>y0&&e.i===2);afterLoad();showBanner(S.year-y0,ev);save();requestAnimationFrame(t=>{last=t;frame(t)})},30);return}
      afterLoad();
    }else{newWorld((Math.random()*2**31)|0);afterLoad();save()}
    requestAnimationFrame(t=>{last=t;frame(t)});
  },60);
}
new ResizeObserver(()=>{resize();chartDirty=true;uiDirty=true;miniDirty=true}).observe($('#mapwrap'));
window.addEventListener('pagehide',()=>{if(S)save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save()});
window.claude?.hot?.snapshot?.(()=>({save:S?serialize():null}));
window.__atlas={get S(){return S},get X(){return X},stepSeason,flyTo,select};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>
